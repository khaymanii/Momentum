name: Production CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/momentum:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/momentum:${{ github.sha }} .

      - name: Push Latest Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/momentum:latest

      - name: Push Commit Tag
        run: docker push ${{ secrets.DOCKER_USERNAME }}/momentum:${{ github.sha }}
